name: SC8886S Driver CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-z96a:
    name: Build sc8886s_charger.ko for Z96A
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install cross compiler + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            bison flex bc libssl-dev libncurses-dev \
            device-tree-compiler kmod

      - name: Checkout kemp233/linux-rockchip (rk-6.1-rkr5.1 - matches z96a board)
        uses: actions/checkout@v4
        with:
          repository: kemp233/linux-rockchip
          ref: rk-6.1-rkr5.1
          path: linux-src

      - name: Copy sc8886s_charger.c into kernel tree
        run: |
          cp $GITHUB_WORKSPACE/sc8886s_charger.c linux-src/drivers/power/supply/
          ls -la linux-src/drivers/power/supply/sc8886s_charger.c

      - name: Add Kconfig entry for SC8886S
        run: |
          cd linux-src
          if ! grep -q "sc8886s_charger" drivers/power/supply/Kconfig; then
            printf '\nconfig CHARGER_SC8886S\n\ttristate "SouthChip SC8886S battery charger"\n\tdepends on I2C\n\thelp\n\t  Say Y to enable support for the SouthChip SC8886S battery\n\t  charger IC, used in Z96A RK3568 laptop boards.\n\n\t  This driver replaces the bq25700_charger driver on i2c-0/0x6b.\n' >> drivers/power/supply/Kconfig
            echo "Added Kconfig entry"
          fi

      - name: Add Makefile entry for SC8886S
        run: |
          cd linux-src
          if ! grep -q "sc8886s_charger" drivers/power/supply/Makefile; then
            echo 'obj-$(CONFIG_CHARGER_SC8886S) += sc8886s_charger.o' >> drivers/power/supply/Makefile
            echo "Added Makefile entry"
          fi

      - name: Use Z96A kernel config (force CONFIG_CHARGER_SC8886S=m via sed)
        run: |
          cd linux-src
          curl -fsSL https://raw.githubusercontent.com/kemp233/armbian-build-sunniwell-Z96a/main/config/kernel/linux-rockchip-rk3568-z96a-legacy.config -o .config
          ls -la .config
          head -3 .config
          # Use sed -i (handles both '=m' and '# is not set' forms)
          for opt in CONFIG_CHARGER_SC8886S=m \
                     CONFIG_CHARGER_BQ25700=m \
                     CONFIG_BATTERY_RK817=y; do
            key=$(echo $opt | cut -d= -f1)
            val=$(echo $opt | cut -d= -f2)
            sed -i -E "s|^#?${key}=.*|${key}=${val}|" .config
            echo "  Set $opt"
          done
          # Verify
          echo "=== SC8886S in .config ==="
          grep "SC8886S" .config | head -3
          echo "=== BQ25700 in .config ==="
          grep "BQ25700" .config | head -3
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make olddefconfig
          echo "=== After olddefconfig ==="
          grep "SC8886S" .config | head -3

      - name: Build sc8886s_charger.ko
        run: |
          cd linux-src
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) modules_prepare
          make -j$(nproc) M=drivers/power/supply sc8886s_charger.ko
          ls -la drivers/power/supply/sc8886s_charger.ko
          file drivers/power/supply/sc8886s_charger.ko
          echo "=== version magic ==="
          aarch64-linux-gnu-modinfo drivers/power/supply/sc8886s_charger.ko 2>/dev/null | grep vermagic

      - name: Upload .ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: sc8886s_charger-z96a.ko
          path: linux-src/drivers/power/supply/sc8886s_charger.ko
          if-no-files-found: error
          retention-days: 30

      - name: Show build summary
        run: |
          echo "=== Build Summary ==="
          ls -la linux-src/drivers/power/supply/sc8886s_charger.ko
          aarch64-linux-gnu-readelf -h linux-src/drivers/power/supply/sc8886s_charger.ko 2>/dev/null | head -10
          echo "=== Symbols ==="
          aarch64-linux-gnu-nm linux-src/drivers/power/supply/sc8886s_charger.ko 2>/dev/null | grep -E "T sc8886s" | head -10
